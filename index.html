<!-- What a search engine reads for the business name, rather than guessing
     it from the page title. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["ProfessionalService", "LocalBusiness"],
  "name": "Mighty Studio",
  "alternateName": ["MIGHTY", "Mighty — photography and more"],
  "description": "Wedding, engagement and event photography and videography, based in Tirana, Albania.",
  "image": "/og-image.jpg",
  "logo": "/favicon.png",
  "telephone": "+355 69 292 1229",
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Tirana",
    "addressCountry": "AL"
  },
  "areaServed": { "@type": "Country", "name": "Albania" },
  "knowsLanguage": ["sq", "en"],
  "sameAs": [
    "https://www.instagram.com/mighty_studioo/",
    "https://www.facebook.com/profile.php?id=61556569860655"
  ],
  "makesOffer": [
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Wedding photography" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Wedding videography" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Engagement and proposal shoots" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Event and concert coverage" } }
  ]
}
</script>
